# Levanta el backend igual que en produccion: Nginx como reverse proxy y balanceador
# delante de 2 replicas de la API. El frontend vive en su propio repositorio
# (intercambio_Divisas_Front_Web) con su propio docker-compose.yml.
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: xchang-backend:latest
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__DefaultConnection: ${SUPABASE_DB_CONNECTION}
    Supabase__ProjectId: ${SUPABASE_PROJECT_ID}
    Supabase__Url: ${SUPABASE_URL}
    Supabase__AnonKey: ${SUPABASE_ANON_KEY}
    Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
    BrevoSettings__ApiKey: ${BREVO_API_KEY}
    BrevoSettings__CorreoRemitente: ${BREVO_SENDER_EMAIL}
    Groq__ApiKey: ${GROQ_API_KEY}
    FrontendSettings__BaseUrl: http://localhost:9200
    Cors__AllowedOrigins: http://localhost:9200
  restart: unless-stopped

services:
  backend-1:
    <<: *backend
    container_name: xchang-backend-1

  backend-2:
    <<: *backend
    container_name: xchang-backend-2

  nginx:
    build:
      context: ./nginx
    image: xchang-nginx:latest
    container_name: xchang-nginx
    ports:
      - "5198:8080"
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped
